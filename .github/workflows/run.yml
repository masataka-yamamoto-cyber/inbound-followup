name: Inbound Followup

on:
  repository_dispatch:
    types: [salesforce-task-created]
  workflow_dispatch: # 手動実行も可能

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # ヘッドレスCIでsf CLIがハングして Node 終了コード13
      # (unsettled top-level await) で落ちるのを防ぐための堅牢化
      SF_USE_GENERIC_UNIX_KEYCHAIN: "true"
      SF_DISABLE_TELEMETRY: "true"
      SF_AUTOUPDATE_DISABLE: "true"
      SF_DISABLE_AUTOUPDATE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install slack_sdk google-auth google-api-python-client

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      - name: Authenticate Salesforce
        run: |
          printf '%s' '${{ secrets.SF_SERVER_KEY }}' > /tmp/server.key
          sf org login jwt \
            --client-id '${{ secrets.SF_CLIENT_ID }}' \
            --jwt-key-file /tmp/server.key \
            --username '${{ secrets.SF_USERNAME }}' \
            --alias prod --set-default
          rm /tmp/server.key
          sf org display --target-org prod

      - name: Set up Gmail credentials
        run: |
          mkdir -p .gmail_credentials
          echo '${{ secrets.GMAIL_SERVICE_ACCOUNT_JSON }}' > .gmail_credentials/service_account.json

      - name: Run script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TASK_LEAD_ID: ${{ github.event.client_payload.lead_id }}
          TASK_ID: ${{ github.event.client_payload.task_id }}
        run: |
          if [ -n "$TASK_ID" ] && [ -n "$TASK_LEAD_ID" ]; then
            python inbound_followup.py --execute --lead-id "$TASK_LEAD_ID" --task-id "$TASK_ID"
          elif [ -n "$TASK_LEAD_ID" ]; then
            python inbound_followup.py --execute --lead-id "$TASK_LEAD_ID"
          else
            python inbound_followup.py --execute
          fi
